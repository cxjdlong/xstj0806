name: Build APK

on:
  push:
    branches: [ main, repair-app ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (cmdline-tools)
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest 2>/dev/null || mv cmdline latest
          rm -f cmdline.zip
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "SDK 就绪: $ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: List output
        run: ls -la app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-repair-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/手机维修.apk
          ls -la out/

      # 发布到 Release：免登录直链，方便 NAS/手机直接下载（artifact 下载需要 GitHub 登录）
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: repair-app-${{ github.run_number }}
          name: 手机维修 App ${{ github.run_number }}（v1.3.0）
          body: |
            自动构建的「手机维修」App（debug 签名，直接安装）。
            - 新增：点「分享 / 发微信」直接调起微信选好友发维修单图片；「保存到本地」存手机相册
            - 新增：开单/维修记录防重复提交，表单内容自动保存不丢
          files: out/手机维修.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
