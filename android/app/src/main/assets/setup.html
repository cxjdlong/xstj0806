<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAS歌下载</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;background:#0f0f0f;color:#ededed}
  body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
       padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
  h1{font-size:21px;margin:0 0 6px}
  p.sub{color:#8b8b8b;font-size:13px;margin:0 0 20px;line-height:1.7}
  label{display:block;font-size:13px;color:#ff8a8a;margin:14px 0 6px}
  input{width:100%;padding:13px 14px;font-size:16px;color:#eee;background:#1a1a1a;
        border:1px solid #2b2b2b;border-radius:10px;outline:none;-webkit-appearance:none}
  input:focus{border-color:#2f6fff}
  button{width:100%;padding:14px;margin-top:20px;font-size:16px;font-weight:600;border:0;
         border-radius:10px;background:#2f6fff;color:#fff}
  button.ghost{background:#2a1a1a;color:#ff8a8a;border:1px solid #5a2b2b;font-weight:500;margin-top:10px}
  .warn{color:#ffb46b;font-size:13px;min-height:20px;margin-top:12px}
  .tip{margin-top:16px;font-size:12.5px;color:#7e7e7e;line-height:1.8}
</style>
</head>
<body>
  <h1>NAS歌曲下载</h1>
  <p class="sub">服务器地址和飞牛音乐账号都要填，填好点「保存并进入」。</p>

  <label>服务器地址</label>
  <input id="url" type="url" placeholder="" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url">

  <label>飞牛音乐账号</label>
  <input id="user" type="text" placeholder="" autocapitalize="off" autocorrect="off" spellcheck="false">

  <button id="save">保存并进入</button>
  <button class="ghost" id="local">不填账号，直接进入（本地歌单）</button>
  <div class="warn" id="warn"></div>

  <div class="tip">
    · 以后想改地址或账号：<b>连按返回键 3 次</b>
  </div>

<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };
function bridge() { return (typeof Android !== 'undefined') ? Android : null; }

(function init() {
  var b = bridge();
  if (!b) return;
  // 不预填任何默认值；只有用户之前填过的才显示出来
  $('url').value = b.savedUrl() || '';
  $('user').value = b.savedUser() || '';
  if (b.savedUrl() && b.savedUser()) $('warn').textContent = '连不上服务器？确认地址和账号后重新保存。';
})();

$('save').onclick = function () {
  var u = $('url').value.trim();
  var name = $('user').value.trim();
  if (!u) { $('warn').textContent = '请填写服务器地址'; $('url').focus(); return; }
  if (!name) { $('warn').textContent = '请填写飞牛音乐账号（不想填就点下面那个按钮进本地歌单模式）'; $('user').focus(); return; }
  $('warn').textContent = '';
  var b = bridge();
  if (b) { b.save(u, name); } else { location.href = u; }
};

$('retry') && ($('retry').onclick = function () {
  var b = bridge();
  if (b) { b.save($('url').value.trim() || b.savedUrl(), $('user').value.trim() || b.savedUser()); }
  else { location.reload(); }
});

// 无飞牛账号也能用：只填服务器地址，直接进本地歌单模式
$('local').onclick = function () {
  var u = $('url').value.trim();
  if (!u) { $('warn').textContent = '请先填写服务器地址'; $('url').focus(); return; }
  $('warn').textContent = '';
  var b = bridge();
  if (b) { b.saveLocal(u); } else { location.href = u + '/?local=1'; }
};
</script>
</body>
</html>
